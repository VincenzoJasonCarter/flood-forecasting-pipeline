[project]
name = "flood-forecasting-pipeline"
version = "0.1.0"
description = "End-to-end flood forecasting: preprocessing + best-model inference against BigQuery."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "prophet>=1.1",
    "pyyaml>=6.0",
    "google-cloud-bigquery[pandas]>=3.11",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
