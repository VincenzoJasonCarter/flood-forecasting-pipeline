# Konfigurasi BigQuery untuk src/prediction (dijalankan via main.py / src/predict.py).
project: thesis-506605
dataset: tables
location: US

# Tabel input harus satu granularity dengan model yang sedang dipakai. Model
# saat ini dilatih dengan data per jam dari tabel-tabel lama (tanpa suffix);
# ganti ke *_daily / *_hourly setelah model untuk granularity itu siap.
tables:
  model_selection: model_selection     # hasil pemilihan model terbaik
  station_features: station_features   # data terbaru untuk input model
  metadata: preprocessing_metadata     # hasil preprocessing untuk data training model
  scalers: preprocessing_scalers       # hasil preprocessing untuk data training model
  forecast_output: forecast_output     # log forecast yang dihasilkan
  weights_suffix: weights              # {model_name}_{weights_suffix}, mis. lstm_weights
