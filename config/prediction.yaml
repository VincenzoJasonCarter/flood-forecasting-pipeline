# Konfigurasi BigQuery untuk src/prediction (dijalankan via main.py / src/predict.py).
project: thesis-506605
dataset: tables
location: US

# Granularity model yang sedang dipakai: hourly | daily. Menentukan LOOKBACK,
# HORIZONS, dan satuan horizon (jam/hari) di src/prediction/config.py.
granularity: daily

# Tabel harus satu granularity dengan `granularity` di atas. Model hourly lama
# ada di tabel tanpa suffix (station_features, preprocessing_metadata,
# preprocessing_scalers, model_selection, forecast_output, {model}_weights).
tables:
  model_selection: model_selection_daily         # hasil pemilihan model terbaik (05_Model_Selection)
  station_features: station_features_daily       # data terbaru untuk input model
  metadata: preprocessing_metadata_daily         # hasil preprocessing untuk data training model
  scalers: preprocessing_scalers_daily           # hasil preprocessing untuk data training model
  forecast_output: forecast_output_daily         # log forecast yang dihasilkan
  weights_suffix: weights_daily                  # {model_name}_{weights_suffix}, mis. lstm_weights_daily
