# Konfigurasi untuk src/raw_preprocessing (dijalankan via `python -m raw_preprocessing`).
project: thesis-506605
dataset: tables
location: US

# Resolusi output: hourly (grid per jam) | daily (max harian per stasiun).
# Bisa di-override per run: `make raw-preprocess ARGS="--granularity hourly"`.
granularity: daily

api:
  base_url: https://sisteminformasibanjir.jakarta.go.id/api/report/posPengamatanReports
  token_env: SIBANJIR_TOKEN   # token API dibaca dari env var ini — jangan ditulis di file ini
  start_date: "2021-01-16"    # tanggal awal crawl; tanggal akhir default = hari ini

tables:
  # Output per granularity: water level (wide) + fitur kalender.
  # Parquet lokal ikut nama ini: artifacts/{nama_tabel}.parquet
  station_features:
    hourly: station_features_hourly
    daily: station_features_daily
